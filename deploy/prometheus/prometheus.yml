# Kolang — Prometheus Configuration

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "kolang-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["kolang-api:8000"]
        labels:
          service: kolang
          component: api

  - job_name: "opa"
    metrics_path: /metrics
    static_configs:
      - targets: ["opa:8181"]
        labels:
          service: kolang
          component: policy-engine
