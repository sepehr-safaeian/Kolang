[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kolang"
version = "0.1.0"
description = "Open-source Agent Control Plane and MCP Gateway for secure, governed access to AI tool infrastructure."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Sepehr Safaeian" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "httpx>=0.27",
    "opentelemetry-api>=1.28",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-exporter-otlp>=1.28",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "structlog>=24.4",
    "python-jose[cryptography]>=3.3",
    "cryptography>=43.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "respx>=0.21",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "bandit[toml]>=1.8",
]

[project.urls]
Homepage = "https://github.com/sepehr-safaeian/Kolang"
Documentation = "https://github.com/sepehr-safaeian/Kolang/tree/main/docs"
Repository = "https://github.com/sepehr-safaeian/Kolang"
Issues = "https://github.com/sepehr-safaeian/Kolang/issues"

# ── Ruff ──────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 99

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle + pyflakes
    "I",              # isort
    "N",              # pep8-naming
    "UP",             # pyupgrade
    "S",              # bandit (flake8-bandit)
    "B",              # flake8-bugbear
    "A",              # flake8-builtins
    "C4",             # flake8-comprehensions
    "DTZ",            # flake8-datetimez
    "T20",            # flake8-print
    "PT",             # flake8-pytest-style
    "SIM",            # flake8-simplify
    "TID",            # flake8-tidy-imports
    "TCH",            # flake8-type-checking
    "RUF",            # ruff-specific
]
ignore = ["S101", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["acp_core"]

# ── mypy ──────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/", "tests/"]

# ── pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers -ra"

# ── coverage ──────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["packages/acp_core"]
omit = ["*/tests/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true

# ── bandit ────────────────────────────────────────────────────────────────────
[tool.bandit]
exclude_dirs = ["tests"]
